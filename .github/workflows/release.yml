name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  # ── Build Rust MCP Server (cross-platform matrix) ───────────────
  build-rust:
    name: Build inkmcpd (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation dependencies (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build Rust binary
        run: |
          cd server
          cargo build --release --target ${{ matrix.target }}
          cd ..

      - name: Strip binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          BINARY="server/target/${{ matrix.target }}/release/inkmcpd${{ matrix.suffix }}"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip "$BINARY"
          else
            strip "$BINARY"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkmcpd-${{ matrix.target }}
          path: server/target/${{ matrix.target }}/release/inkmcpd${{ matrix.suffix }}
          if-no-files-found: error

  # ── Package extension zip ───────────────────────────────────────
  package:
    name: Package inkmcp-extension
    needs: build-rust
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all Rust binaries
        uses: actions/download-artifact@v4
        with:
          pattern: inkmcpd-*
          path: downloaded-binaries
          merge-multiple: true

      - name: Organize binaries and build packages
        run: |
          # ── Create per-platform package directories ──
          PLATFORMS="linux-x86_64 linux-arm64 macos-x86_64 macos-arm64 windows-x86_64"
          for plat in $PLATFORMS; do
            mkdir -p "package-${plat}/inkmcp"
          done

          # ── Copy shared Python extension files into each platform package ──
          for plat in $PLATFORMS; do
            cp inkscape_mcp.inx "package-${plat}/"
            cp inkscape_mcp.py "package-${plat}/"
            cp -r inkmcp/ "package-${plat}/inkmcp/"
            rm -rf "package-${plat}/inkmcp/venv"
          done

          # ── Place each Rust binary into its correct platform package ──
          for binary in downloaded-binaries/*; do
            case "$binary" in
              *x86_64-unknown-linux-gnu*)
                cp "$binary" "package-linux-x86_64/inkmcpd"
                chmod +x "package-linux-x86_64/inkmcpd"
                ;;
              *aarch64-unknown-linux-gnu*)
                cp "$binary" "package-linux-arm64/inkmcpd"
                chmod +x "package-linux-arm64/inkmcpd"
                ;;
              *x86_64-apple-darwin*)
                cp "$binary" "package-macos-x86_64/inkmcpd"
                chmod +x "package-macos-x86_64/inkmcpd"
                ;;
              *aarch64-apple-darwin*)
                cp "$binary" "package-macos-arm64/inkmcpd"
                chmod +x "package-macos-arm64/inkmcpd"
                ;;
              *windows*)
                cp "$binary" "package-windows-x86_64/inkmcpd.exe"
                ;;
            esac
          done

          echo "Package contents:"
          for plat in $PLATFORMS; do
            echo "--- $plat ---"
            find "package-${plat}" -type f | sort
          done

      - name: Create Platform-Specific Archives
        run: |
          cd package-linux-x86_64
          zip -r ../inkmcp-linux-x86_64.zip .
          cd ..

          cd package-linux-arm64
          rm -f inkmcpd.exe
          zip -r ../inkmcp-linux-arm64.zip .
          cd ..

          cd package-macos-x86_64
          zip -r ../inkmcp-macos-x86_64.zip .
          cd ..

          cd package-macos-arm64
          zip -r ../inkmcp-macos-arm64.zip .
          cd ..

          cd package-windows-x86_64
          zip -r ../inkmcp-windows-x86_64.zip .
          cd ..

          # Legacy cross-platform archive (files only, no binaries)
          mkdir -p package-legacy
          cp inkscape_mcp.inx package-legacy/
          cp inkscape_mcp.py package-legacy/
          cp -r inkmcp/ package-legacy/inkmcp/
          rm -rf package-legacy/inkmcp/venv
          cd package-legacy
          zip -r ../inkmcp-extension.zip .
          cd ..

          echo "Generated archives:"
          ls -la inkmcp-*.zip

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: "Inkmcp v${{ github.ref_name }}"
          body: |
            ## Cross-Platform Release 🎉

            This release includes the native Rust MCP Server binary for each platform,
            plus the legacy pure-Python extension package.

            ### Platform Downloads

            | Platform | Architecture | Download |
            |----------|-------------|----------|
            | **Linux** | x86_64 | `inkmcp-linux-x86_64.zip` |
            | **Linux** | ARM64 | `inkmcp-linux-arm64.zip` |
            | **macOS** | Intel | `inkmcp-macos-x86_64.zip` |
            | **macOS** | Apple Silicon | `inkmcp-macos-arm64.zip` |
            | **Windows** | x86_64 | `inkmcp-windows-x86_64.zip` |
            | **All (Python-only)** | Cross-platform | `inkmcp-extension.zip` |

            ### Quick Start
            1. Extract the archive for your platform
            2. Extract to your Inkscape extensions directory
            3. Start Inkscape (or run `inkmcpd` standalone)
            4. Configure your AI tool to use `run_inkscape_mcp.sh` (Linux/macOS) or `run_inkscape_mcp.bat` (Windows)

            ### New Architecture
            - **Rust MCP Server** (`inkmcpd`): Native binary handling MCP protocol + TCP transport
            - **Python Worker**: Inkscape SVG operations via inkex (unchanged)
            - **No D-Bus required** — works on Windows, macOS, and Linux
          draft: false
          prerelease: true
          files: |
            inkmcp-linux-x86_64.zip
            inkmcp-linux-arm64.zip
            inkmcp-macos-x86_64.zip
            inkmcp-macos-arm64.zip
            inkmcp-windows-x86_64.zip
            inkmcp-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
